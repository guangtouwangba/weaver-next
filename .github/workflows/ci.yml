name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Build workspace packages
        run: npm run build:packages

      - name: Build widget
        run: npm run build:widget

      - name: TS unit tests
        run: npm run test:ts

      - name: Widget typecheck
        run: npm run typecheck:widget

      - name: Build and validate installable plugin
        run: |
          node scripts/build-plugin-release.mjs
          npm run check:release
          npm run probe:release
