[project]
name = "weaver-next-api"
version = "0.1.0"
description = "FastAPI service for Weaver Next"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "alembic>=1.13.0",
  "pydantic>=2.8.0",
  "python-ulid>=2.7.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0"
]

[tool.setuptools.packages.find]
include = ["weaver_api*", "weaver_core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests"]
